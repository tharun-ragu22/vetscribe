name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 python3-tk python3-dev xvfb

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -v

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  backend-evals:
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434 >/dev/null && exit 0
            sleep 1
          done
          echo "ollama server did not come up in time" >&2
          exit 1

      - name: Pull gemma4:e4b
        run: ollama pull gemma4:e4b

      - name: Run note generator evals
        working-directory: backend
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_NOTE_MODEL: gemma4:e4b
        run: uv run python -m evals.note_generator_evals

  build-windows-exe:
    needs: [test, backend-evals]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build VetScribe.exe (--onedir)
        run: uv run pyinstaller build_spec/vetscribe.spec --distpath dist --workpath build

      - name: Upload VetScribe.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: VetScribe-windows
          path: dist/VetScribe
