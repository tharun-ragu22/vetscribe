name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 python3-tk python3-dev xvfb

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests (Linux, headless display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest -v

      # Works around a known upstream bug (actions/setup-python#1102,
      # astral-sh/python-build-standalone#939): tkinter randomly fails with
      # "Can't find a usable init.tcl" on Windows when running inside a venv
      # (sys.prefix != sys.base_prefix) with a non-interactive stdin, which is
      # always true for a non-TTY GitHub Actions step. In that combination, Tk's
      # console-window init spawns a second Tcl interpreter that doesn't inherit
      # the tcl_library value Python computed, so it can't find its own install.
      # Setting TCL_LIBRARY/TK_LIBRARY explicitly sidesteps this — the same
      # workaround the CPython/python-build-standalone maintainers point to,
      # pending an upstream fix. Derived from sys.base_prefix (the interpreter
      # actually backing .venv) rather than hardcoded, so it tracks whichever
      # Python version/tcl release the runner image ships.
      - name: Set Tcl/Tk library paths (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv run python - <<'PY' >> "$GITHUB_ENV"
          import sys
          from pathlib import Path
          tcl_dir = Path(sys.base_prefix) / "tcl"
          tcl_lib = next(tcl_dir.glob("tcl8*"))
          tk_lib = next(tcl_dir.glob("tk8*"))
          print(f"TCL_LIBRARY={tcl_lib.as_posix()}")
          print(f"TK_LIBRARY={tk_lib.as_posix()}")
          PY

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -v

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  backend-evals:
    needs: [test-backend, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434 >/dev/null && exit 0
            sleep 1
          done
          echo "ollama server did not come up in time" >&2
          exit 1

      - name: Pull gemma4:e4b
        run: ollama pull gemma4:e4b

      - name: Run note generator evals
        working-directory: backend
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_NOTE_MODEL: gemma4:e4b
        run: uv run python -m evals.note_generator_evals

  build-windows-exe:
    needs: [test, backend-evals]
    # backend-evals is skipped entirely when backend/ didn't change (see the
    # `changes` job); a skipped dependency fails the implicit success() check
    # that gates downstream jobs by default, so this must be spelled out
    # explicitly rather than left to the default `if`.
    if: always() && needs.test.result == 'success' && (needs.backend-evals.result == 'success' || needs.backend-evals.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build VetScribe.exe (--onedir)
        run: uv run pyinstaller build_spec/vetscribe.spec --distpath dist --workpath build

      - name: Upload VetScribe.exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: VetScribe-windows
          path: dist/VetScribe
